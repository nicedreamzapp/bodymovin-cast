<!doctype html>
<html>
<head>
<script src="_lg/polyfills.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peekaboo Gallery · Body Movin'</title>
<style>
  html, body { margin: 0; height: 100%; background: #060406; overflow: hidden; cursor: none; }
  canvas { display: block; position: fixed; top:0;right:0;bottom:0;left:0; width: 100vw; height: 100vh; }
  #hud { z-index: 2; }
</style>

<script src="body.js"></script>
<script src="howto.js"></script>
<script src="scores.js"></script>
<script>(function() {
  const BP = window.BodyMovin;
  const T = "max(1.6vmin,8px)", L = "max(1.6vmin,8px)", BH = "max(38px,5.8vmin)", HW = "max(104px,14vmin)", MW = "max(96px,13vmin)", GP = "max(6px,1vmin)";
  const glass = "top:".concat(T, ";height:").concat(BH, ";min-height:0;box-sizing:border-box;border-radius:999px;border:1px solid rgba(255,255,255,.18);") + 'background:rgba(10,12,24,.55);color:#fff;opacity:1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:800 max(14px,2vmin)/1 -apple-system,system-ui,"Segoe UI",sans-serif;letter-spacing:.06em;padding:0;margin:0';
  BP.menuBtnStyle = "".concat(glass, ";left:calc(").concat(L, " + ").concat(HW, " + ").concat(GP, ");width:").concat(MW);
  BP.musicBtnStyle = "".concat(glass, ";left:calc(").concat(L, " + ").concat(HW, " + ").concat(MW, " + ").concat(GP, " * 2);width:").concat(BH, ";min-width:0");
  BP.uiRow = () => {
    const vm = Math.min(innerWidth, innerHeight) / 100, t = Math.max(1.6 * vm, 8), h = Math.max(38, 5.8 * vm);
    return { bottom: t + h, right: Math.max(1.6 * vm, 8) + Math.max(104, 14 * vm) + Math.max(96, 13 * vm) + h + 2 * Math.max(6, vm) };
  };
  BP.uiBelow = (x) => {
    const r = BP.uiRow(), g = Math.max(8, Math.min(innerWidth, innerHeight) * 0.015);
    return x >= r.right + g ? 0 : x >= innerWidth * 0.3 ? r.bottom + g : Math.max(r.bottom + g, innerHeight * 0.16);
  };
  BP.uiCover = null;
  const hit = (a, b) => a && b && a.x < b.left + b.width && a.x + a.w > b.left && a.y < b.top + b.height && a.y + a.h > b.top;
  (function camLoop() {
    requestAnimationFrame(camLoop);
    const cam = document.getElementById("bp-cam");
    if (!cam) return;
    const card = document.querySelector(".bph-wrap:not(.bph-gone) .bph-card"), cr = card && card.getBoundingClientRect();
    const r = cam.getBoundingClientRect(), cover = cr && cr.width && hit({ x: cr.left, y: cr.top, w: cr.width, h: cr.height }, r) || hit(BP.uiCover, r);
    cam.style.visibility = cover ? "hidden" : "";
  })();
  BP.uiHowTo = (cfg) => {
    const place = () => {
      const top = Math.max(BP.uiRow().bottom + 10, innerHeight * 0.16) / innerHeight;
      BP.howTo(Object.assign({}, cfg, { top, bottom: typeof cfg.bottom === "function" ? cfg.bottom() : cfg.bottom }));
    };
    BP._howCfg = place;
    place();
    if (!BP._howRs) {
      BP._howRs = true;
      addEventListener("resize", () => {
        if (BP.howTo.visible) BP._howCfg();
      });
    }
  };
  const mk = () => {
    if (document.getElementById("bp-home")) return;
    const b = document.createElement("button");
    b.id = "bp-home";
    b.textContent = "← HOME";
    b.setAttribute("aria-label", "back to Body Movin' home");
    b.style.cssText = "position:fixed;z-index:30;".concat(glass, ";left:").concat(L, ";width:").concat(HW, ";cursor:pointer;overflow:hidden");
    const go = () => {
      location.href = "index.html";
    };
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      e.preventDefault();
      go();
    });
    document.body.appendChild(b);
    BP.uiHome = b;
    (function loop(now) {
      requestAnimationFrame(loop);
      if (!BP.handOver || !BP.dwell || b.style.display === "none") return;
      const r = b.getBoundingClientRect(), over = BP.handOver({ x: r.left, y: r.top, w: r.width, h: r.height }, innerWidth, innerHeight);
      const k = BP.dwell("bp-home", over, now, 1200);
      b.style.boxShadow = over ? "inset " + Math.round((k || 0) * r.width) + "px 0 0 #66e0ff55" : "none";
      if (k === 1) go();
    })(performance.now());
  };
  document.readyState === "loading" ? addEventListener("DOMContentLoaded", mk) : setTimeout(mk, 0);
})();
</script>
<script src="tips.js"></script>
<script>function showHowTo(pick) {
  const gun = pick || ({ two: 1, grip: 1, one: 1 }[localStorage.gallery_gun] ? localStorage.gallery_gun : "two");
  const aim = gun === "grip" ? { anim: "push", text: "Hold both hands together out in front, like a pistol" } : gun === "one" ? { anim: "point", text: "Point one hand like a pistol. Either hand works" } : { anim: "push", text: "Point both hands: a pistol in each one" };
  BodyMovin.uiHowTo({
    title: "PEEKABOO GALLERY",
    corner: false,
    bottom: 0.6,
    // no corner reminder: the one bottom prompt line says what to do
    moves: [aim, { anim: "point", text: "Keep a crosshair on a target and it fires" }, { anim: "lean", text: "Lean to peek around corners" }],
    you: "The glowing figure in the middle is you"
  });
  const place = BodyMovin._howCfg;
  BodyMovin._howCfg = () => {
    place();
    noShootLine();
  };
  noShootLine();
}
function noShootLine() {
  const card = document.querySelector(".bph-wrap:not(.bph-gone) .bph-card");
  if (!card || card.querySelector(".bph-noshoot")) return;
  const d = document.createElement("div");
  d.className = "bph-you bph-noshoot";
  d.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="23" rx="8.5" ry="10" fill="#6a3fd0"/><path d="M12.5 15 L13.5 8 L17 13 Z M27.5 15 L26.5 8 L23 13 Z" fill="#6a3fd0"/><circle cx="16.5" cy="18" r="3.3" fill="#fff"/><circle cx="23.5" cy="18" r="3.3" fill="#fff"/><circle cx="16.5" cy="18" r="1.5" fill="#000"/><circle cx="23.5" cy="18" r="1.5" fill="#000"/><ellipse cx="20" cy="27" rx="4.5" ry="4" fill="#eee4ff"/><circle cx="20" cy="20" r="17" fill="none" stroke="#ff2a2a" stroke-width="3.6"/><path d="M8 8 L32 32" stroke="#ff2a2a" stroke-width="3.6" stroke-linecap="round"/></svg><span>Don\'t shoot the purple owls</span>';
  card.appendChild(d);
}
(function() {
  const st = document.createElement("style");
  st.textContent = ".bph-noshoot{color:#ff9a9a!important;display:flex;align-items:center;justify-content:center;gap:.4em;margin-top:1.2vmin!important}.bph-noshoot:before{display:none!important}.bph-noshoot svg{width:1.7em;height:1.7em;flex:none}";
  document.head.appendChild(st);
})();
showHowTo();
</script>
<script>BodyMovin.selfView = null;
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<script type="module" src="_lg/gallery-0.js"></script>
</body>
</html>
