        if (!smashed && e.p < 1e3) sfx("jumpScore");
        break;
      case "smash":
        sfx("smash");
        break;
      case "throw":
        sfx("throw");
        break;
      case "bounce":
        sfx("bounce", 90);
        break;
      case "roll":
        sfx("roll", 120);
        break;
      case "hammerOn":
        sfx("hammerOn");
        musicPlay("hammer");
        break;
      case "hammerOff":
        musicPlay(game.stage.id === "rivets" ? "rivets" : "barrels");
        break;
      case "rivet":
        sfx("rivet");
        break;
      case "item":
        sfx("item");
        break;
      case "oil":
        sfx("oil");
        break;
      case "fireSpawn":
        sfx("fireSpawn", 200);
        break;
      case "pound":
        sfx("pound", 400);
        break;
      case "hurry":
        sfx("hurry");
        break;
      case "extraLife":
        sfx("extraLife");
        break;
      case "death":
        musicStop();
        setTimeout(() => {
          if (S.state === "play") musicPlay("death", true);
        }, 500);
        break;
      case "clear":
        musicStop();
        musicPlay("clear", true);
        break;
      case "intro":
        musicStop();
        musicPlay("intro", true);
        break;
      case "gameover":
        break;
    }
  }
  let frames = 0;
  function frame(now) {
    BP.update(now);
    const dt = Math.min(0.1, (now - (S.last || now)) / 1e3);
    S.last = now;
    frames++;
    if (S.state === "title" && TV && S.tvAt && now > S.tvAt) {
      S.tvAt = 0;
      startRound(now);
    }
    readBody(now);
    game.opts.ladderTol = BODY.seen ? 6 : 4;
    const easyBody = EASY() && BODY.seen;
    if (S.state === "play") {
      S.acc += dt;
      let n = 0;
      const pi = pointerIntent();
      if (BODY.jump || KEY.jump && now - KEY.jump < 150) {
        S.jumpAge = BODY.jump ? (BODY.jumpAge || 0) + CAM_LAG_MS : 0;
        S.jumpPend = now;
        KEY.jump = 0;
      }
      while (S.acc >= 1 / 60 && n < 5) {
        S.acc -= 1 / 60;
        n++;
        const canJump = G.hero.st === "walk" && !G.hero.ham;
        const jump = S.jumpPend && now - S.jumpPend < 160 && canJump && G.mode === "play";
        if (jump || S.jumpPend && now - S.jumpPend >= 160) S.jumpPend = 0;
        if (G.hero.ham && S.jumpPend) S.jumpPend = 0;
        const ez = easyBody ? easyClimb() : 0, bw = BODY.walk && !ez;
        game.opts.ladderTol = ez && G.hero.st === "walk" ? EASY_TOL : BODY.seen ? 6 : 4;
        const inp = {
          left: KEY.left || pi.left || bw && BODY.dir < 0,
          right: KEY.right || pi.right || bw && BODY.dir > 0,
          up: KEY.up || pi.up || (easyBody ? ez < 0 : BODY.up),
          down: KEY.down || pi.down || (easyBody ? ez > 0 : BODY.down),
          jump: !!jump,
          jumpAge: jump ? (S.jumpAge || 0) / (1e3 / 60) : 0
        };
        if (jump) S.lastJumpAge = Math.round(S.jumpAge || 0);
        if (inp.left && inp.right) inp.left = inp.right = false;
        S.inp = inp;
        if (inp.jump) {
          S.jumpShow = now;
          S.jumpVis = { f: G.frames + 1, y0: G.hero.y };
        }
        const evs = game.step(inp);
        onEvents(evs);
        if (G.mode === "play" && !MUS.name && ac) musicPlay(game.stage.id === "rivets" ? "rivets" : "barrels");
        if (G.mode === "gameover") {
          endRound(now);
          break;
        }
      }
      if (S.acc > 0.1) S.acc = 0;
    } else if (S.state === "title") {
      G.captive.help = (G.captive.help + 1) % 240;
      G.frames++;
      G.ape.t++;
    }
    ctx.clearRect(0, 0, W, H);
    buttons = [];
    drawField(now);
    blitField();
    if (S.state === "title") drawTitle(now);
    else if (S.state === "end") drawEnd(now);
    else {
      drawPrompt(now);
      drawPad(now);
    }
    if (S.state !== "play") BP.drawHands(ctx, W, H);
    Object.assign(window.__game, {
      state: S.state,
      mode: G.mode,
      play: MODE,
      autoClimb: AC.dir,
      heroF: G.hero.f,
      walkDir: BODY.walk ? BODY.dir < 0 ? "L" : "R" : "-",
      score: G.score,
      lives: G.lives,
      level: G.level,
      stage: G.stageId,
      height: G.height,
      bonus: G.bonus,
      hero: { x: G.hero.x, y: G.hero.y, st: G.hero.st, f: G.hero.f, ham: G.hero.ham },
      jumpAge: S.lastJumpAge || 0,
      rawJumps: C.st.rawJumps,
      barrels: G.barrels.length,
      fires: G.fires.length,
      frames,
      audioErrors,
      body: Object.assign({}, BODY),
      field: { x: FIELD.x / W, y: FIELD.y / H, w: FIELD.w / W, h: FIELD.h / H },
      buttons: buttons.map((b) => ({ id: b.id, x: (b.rect.x + b.rect.w / 2) / W, y: (b.rect.y + b.rect.h / 2) / H, w: b.rect.w / W, h: b.rect.h / H, fill: b.fill, sel: !!b.sel }))
    });
    requestAnimationFrame(frame);
  }
  window.__game.engine = () => game;
  window.__game.start = () => startRound(performance.now());
  window.__game.endNow = () => {
    if (S.state === "play") {
      G.lives = 1;
      G.mode = "dead";
      G.modeT = GE.T.deadFrames;
    }
  };
  resize();
  showHowTo();
  S.best = BP.best(GAME);
  BP.start();
  S.state = "title";
  if (TV) S.tvAt = performance.now() + 2e3;
  window.__game.ready = true;
  requestAnimationFrame(frame);
})();
</script>
</body>
