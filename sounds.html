<!doctype html>
<html><head>
<script src="_lg/polyfills.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Body Movin' · end-of-game sounds</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0918;color:#fff;font-family:-apple-system,system-ui,sans-serif}
.c{max-width:620px;padding:28px}
h1{font-size:26px;margin:0 0 6px}p{color:#c9d6ff;line-height:1.5;margin:0 0 22px}
button{display:block;width:100%;text-align:left;margin:0 0 14px;padding:16px 20px;border-radius:16px;border:1px solid #ffffff30;background:#ffffff0d;color:#fff;font:700 17px -apple-system,system-ui,sans-serif;cursor:pointer}
button span{display:block;font-weight:500;font-size:14px;color:#ffffffb0;margin-top:4px}
button.now{border-color:#7dff9a;background:#7dff9a18}
</style></head><body><div class="c">
<h1>Table tennis: end-of-match sounds</h1>
<p>The first two are the old sounds, which are gone now. The last one is what plays today.</p>
<button id="b1">▶ The static buzz (old, the real culprit)<span>after the match ended, the ball kept bouncing on the table faster and faster; each bounce clicked</span></button>
<button id="b2">▶ The "crowd cheer" (old)<span>a burst of filtered white noise meant to sound like an audience; it just sounds like static</span></button>
<button id="b3" class="now">▶ What plays now<span>a short two-note win chime, nothing else</span></button>
</div>
<script>let ac = null;
const A = () => ac = ac || new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, len, vol, type = "sine", at = 0) {
  const c = A(), t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(1e-4, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 2e-3);
  g.gain.exponentialRampToValueAtTime(1e-4, t + len);
  o.connect(g);
  g.connect(c.destination);
  o.start(t);
  o.stop(t + len + 0.02);
}
function click(freq, q, len, vol, at = 0) {
  const c = A(), t = c.currentTime + at, n = c.createBufferSource(), buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
  n.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = freq;
  f.Q.value = q;
  const g = c.createGain();
  g.gain.value = vol;
  n.connect(f);
  f.connect(g);
  g.connect(c.destination);
  n.start(t);
}
function crowd(vol) {
  const c = A(), t = c.currentTime, len = 1.8, n = c.createBufferSource(), buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  n.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = 1100;
  f.Q.value = 0.6;
  const g = c.createGain();
  g.gain.setValueAtTime(1e-4, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.25);
  g.gain.exponentialRampToValueAtTime(1e-4, t + len);
  n.connect(f);
  f.connect(g);
  g.connect(c.destination);
  n.start(t);
}
const win = () => {
  tone(660, 0.25, 0.2, "triangle");
  tone(990, 0.4, 0.2, "triangle", 0.12);
};
document.getElementById("b1").onclick = () => {
  win();
  crowd(0.25);
  let at = 0.5, gap = 0.8;
  while (at < 6) {
    click(1200, 2, 0.06, 0.8, at);
    tone(720, 0.06, 0.3, "sine", at);
    at += gap;
    gap = Math.max(0.03, gap * 0.8);
  }
};
document.getElementById("b2").onclick = () => {
  win();
  crowd(0.25);
  setTimeout(() => crowd(0.5), 150);
};
document.getElementById("b3").onclick = () => win();
</script></body></html>
